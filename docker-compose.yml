version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zecure_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zecure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d zecure"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zecure_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      AUTH_ENV: development
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/zecure
      CORS_ORIGINS: http://localhost:3000
      EMAIL_PROVIDER: development
      AUTH_SESSION_SECRET: zecure-session-secret-key-change-in-production-32bytes
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: zecure_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
